<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post | Conquiguias World</title>
    <meta name="description" content="Publicación de Conquiguias World." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="canonical" href="/post" />
    <meta property="og:site_name" content="Conquiguias World" />
    <meta property="og:type" content="article" />
    <meta property="og:title" content="Post | Conquiguias World" />
    <meta property="og:description" content="Publicación de Conquiguias World." />
    <meta property="og:url" content="/post" />
    <meta property="og:image" content="/logo1.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Post | Conquiguias World" />
    <meta name="twitter:description" content="Publicación de Conquiguias World." />
    <meta name="twitter:image" content="/logo1.png" />
    
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <!-- Sistema de reproducción igual al panel -->
    <script src="../lib/clappr.js"></script>
    <script src="../lib/clappr-pip-plugin.js"></script>
    <script src="../lib/level-selector.js"></script>
    <script src="../lib/clappr-playback-rate.js"></script>
    <script src="../lib/dashShakaPlayBack.js"></script>
    <script src="../lib/hlsjs-playback.js"></script>
    <script src="../lib/clappr-youtube-playback.js"></script>
    <script src="../lib/audio-track-selector.js"></script>
    <script src="../lib/jquery-3.2.1.min.js"></script>
    <script src="../lib/lunaradio.min.js"></script>
    <style>
      :root {
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-card: #1e293b;
        --text-primary: #e2e8f0;
        --text-secondary: #94a3b8;
        --accent-color: #3b82f6;
        --danger-color: #ef4444;
        --success-color: #10b981;
        --warning-color: #f59e0b;
        --border-color: #334155;
        --shadow-color: rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      html {
        height: 100%;
        overflow: hidden;
      }

      body {
        background: var(--bg-primary);
        color: var(--text-primary);
        height: 100%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .page-wrap {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 10px;
        overflow: hidden;
      }

      #postRoot {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      .state-box {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 18px;
        text-align: center;
        color: var(--text-secondary);
      }

      .single-post-shell {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 12px;
        box-shadow: 0 6px 15px var(--shadow-color);
        border: 1px solid var(--border-color);
        background: linear-gradient(
          180deg,
          rgba(30, 41, 59, 0.95),
          rgba(15, 23, 42, 0.98)
        );
      }

      .post-card {
        background: var(--bg-card);
        border-radius: 12px;
        box-shadow: 0 0 10px var(--shadow-color);
        overflow: hidden;
        border: 1px solid var(--border-color);
        margin-bottom: 0;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .post-header {
        display: flex;
        align-items: center;
        padding: 15px;
        border-bottom: 1px solid var(--border-color);
      }

      .post-user-img {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        object-fit: cover;
        margin-right: 12px;
        border: 2px solid var(--accent-color);
      }

      .post-contenedor {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .post-user-name {
        font-weight: bold;
        color: var(--text-primary);
        flex: 1;
      }

      .status-admin {
        background: #facc15;
        color: #1f2937;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 9px;
        border-radius: 999px;
      }

      .post-time {
        font-size: 12px;
        color: var(--text-secondary);
      }

      .post-video-views {
        font-size: 11px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 2px;
      }
      .post-video-views .views-icon {
        color: #e53e3e;
        font-size: 11px;
      }

      @keyframes live-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.55);
        }
        50% {
          box-shadow: 0 0 0 6px rgba(239, 68, 68, 0.15);
        }
      }

      .post-user-img.live-border {
        border-color: #ef4444 !important;
        animation: live-pulse 1.6s ease-in-out infinite;
      }

      .badge-en-vivo {
        background: #ef4444;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 9px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .post-card.live-post {
        border-color: rgba(239, 68, 68, 0.45);
        box-shadow:
          0 0 0 1px rgba(239, 68, 68, 0.2),
          0 4px 14px rgba(239, 68, 68, 0.1);
      }

      .post-options-toggle {
        margin-left: auto;
        border: 1px solid var(--border-color);
        background: rgba(15, 23, 42, 0.6);
        color: var(--text-secondary);
        border-radius: 8px;
        padding: 6px 8px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        text-decoration: none;
        transition:
          color 0.2s,
          border-color 0.2s;
      }

      .post-options-toggle:hover {
        color: var(--accent-color);
        border-color: var(--accent-color);
      }

      /* Clappr player */
      .clappr-container {
        width: 100%;
        height: 100%;
        display: block;
        position: relative;
        z-index: 1;
        background: transparent !important;
      }

      .media-blur-video-shell .clappr-container [data-player],
      .media-blur-video-shell .clappr-container .container[data-container],
      .media-blur-video-shell .clappr-container [data-html5-video],
      .media-blur-video-shell .clappr-container video {
        background: transparent !important;
        background-color: transparent !important;
      }

      .media-blur-video-shell .clappr-container [data-html5-video],
      .media-blur-video-shell .clappr-container video {
        object-fit: contain !important;
      }

      .lunaradio-host {
        width: 100%;
        height: 100%;
        min-height: 220px;
        display: flex;
      }

      /* Mobile comments modal */
      .comments-mobile-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        z-index: 5000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 14px;
      }

      .comments-mobile-content {
        width: min(100%, 520px);
        max-height: 85vh;
        overflow: auto;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        background: var(--bg-card);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      }

      .comments-mobile-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border-color);
        color: var(--text-primary);
        font-weight: 600;
      }

      .comments-mobile-close {
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 18px;
        padding: 2px 6px;
      }

      .comments-mobile-body {
        padding: 12px 14px;
      }

      /* Share modal */
      .share-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        z-index: 6000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 14px;
      }
      .share-modal-box {
        width: min(100%, 560px);
        max-height: 90vh;
        overflow: auto;
        border: 1px solid var(--border-color);
        border-radius: 14px;
        background: var(--bg-card);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
      }
      .share-modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border-color);
        font-weight: 600;
        color: var(--text-primary);
      }
      .share-modal-close {
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 18px;
        padding: 2px 6px;
      }
      .share-modal-body {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .share-modal-label {
        font-size: 12px;
        color: var(--text-secondary);
      }
      .share-modal-link-row {
        display: flex;
        gap: 8px;
      }
      .share-modal-link-row input {
        flex: 1;
        padding: 10px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--bg-secondary);
        color: var(--text-primary);
        font-size: 13px;
      }
      .share-modal-copy-btn {
        padding: 10px 14px;
        border: none;
        border-radius: 8px;
        background: var(--accent-color);
        color: white;
        cursor: pointer;
        font-size: 13px;
        white-space: nowrap;
      }
      .share-modal-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .share-modal-action-btn {
        padding: 9px 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--bg-secondary);
        color: var(--text-primary);
        cursor: pointer;
        font-size: 13px;
      }
      .share-modal-embed {
        width: 100%;
        min-height: 72px;
        padding: 10px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--bg-secondary);
        color: var(--text-secondary);
        font-size: 12px;
        resize: none;
        box-sizing: border-box;
      }
      .share-modal-networks {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .share-modal-network-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        color: var(--text-primary);
        text-decoration: none;
        background: var(--bg-secondary);
        font-size: 13px;
      }
      .share-modal-status {
        font-size: 12px;
        color: var(--text-secondary);
        min-height: 18px;
      }
      .share-modal-footer {
        padding: 12px 16px;
        border-top: 1px solid var(--border-color);
        text-align: right;
      }
      .share-modal-accept-btn {
        padding: 9px 22px;
        border: none;
        border-radius: 8px;
        background: var(--accent-color);
        color: white;
        cursor: pointer;
        font-size: 14px;
      }

      .post-content {
        width: 100%;
        position: relative;
      }

      .media-blur-shell {
        position: relative;
        width: 100%;
        height: 350px;
        overflow: hidden;
        background: #000;
        border-radius: 0;
      }

      .media-blur-bg-img,
      .media-blur-bg-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: blur(22px);
        transform: scale(1.12);
        opacity: 0.72;
        pointer-events: none;
      }

      .media-blur-bg-fallback {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            circle at 20% 30%,
            rgba(59, 130, 246, 0.35),
            transparent 45%
          ),
          radial-gradient(
            circle at 80% 75%,
            rgba(168, 85, 247, 0.28),
            transparent 40%
          ),
          linear-gradient(180deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
        filter: blur(16px);
        transform: scale(1.08);
        opacity: 0.9;
        pointer-events: none;
      }

      .post-content .media-front-media {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: transparent;
        border-radius: 0;
        overflow: hidden;
        display: block;
      }

      .media-blur-video-shell video {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: transparent;
      }

      .post-description {
        padding: 10px;
        color: var(--text-primary);
        font-size: 14px;
        line-height: 1.45;
      }

      .post-description .post-description-text {
        display: block;
        white-space: pre-wrap;
        word-break: break-word;
        overflow-wrap: anywhere;
      }

      .post-description .post-description-text.clamped {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
        line-clamp: 3;
        overflow: hidden;
      }

      .post-description .post-description-clamp-wrap {
        position: relative;
      }

      .post-description .post-description-clamp-wrap.has-overflow .post-description-text.clamped {
        padding-right: 96px;
      }

      .read-more-btn {
        background: none;
        border: none;
        color: var(--accent-color);
        cursor: pointer;
        font-weight: bold;
        padding: 0 0 0 10px;
        margin: 0;
        font-size: 14px;
        display: none;
        position: absolute;
        right: 0;
        bottom: 0;
        line-height: 1.45;
        background: linear-gradient(to right, transparent, var(--bg-card) 24%, var(--bg-card) 100%);
        white-space: nowrap;
        z-index: 1;
      }

      .post-description .post-description-clamp-wrap.has-overflow .read-more-btn {
        display: inline-block;
      }

      .read-less-btn {
        background: none;
        border: none;
        color: var(--accent-color);
        cursor: pointer;
        font-weight: bold;
        padding: 6px 0 0;
        font-size: 14px;
        display: inline-block;
      }

      .read-more-btn:hover,
      .read-less-btn:hover {
        color: var(--accent-hover);
        text-decoration: underline;
      }

      .post-body-layout {
        display: flex;
        padding: 0;
        margin: 0;
        align-items: stretch;
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      .post-main-column {
        width: 100%;
        min-width: 0;
        overflow-y: auto;
        overflow-x: hidden;
      }

      .post-sidebar-column {
        display: none;
        border-left: 1px solid var(--border-color);
        padding: 5px;
        min-height: 0;
        overflow: hidden;
      }

      .post-card.comments-open .post-main-column {
        width: 70%;
      }

      .post-card.comments-open .post-sidebar-column {
        display: flex;
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 30%;
      }

      .post-actions {
        padding: 10px 15px;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--border-color);
        gap: 10px;
      }

      .post-actions-left,
      .post-actions-right {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: nowrap;
      }

      .post-actions-left {
        flex: 1;
        min-width: 0;
        overflow-x: hidden;
      }

      .post-actions-right {
        justify-content: flex-end;
        min-width: max-content;
        overflow: visible;
      }

      .reaction-btn {
        background: none;
        border: 2px solid transparent;
        border-radius: 20px;
        padding: 6px 12px;
        margin: 2px;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 5px;
        color: var(--text-secondary);
      }

      .reaction-btn:hover {
        background-color: rgba(255, 255, 255, 0.05);
        transform: none;
      }

      .reaction-btn.active {
        background-color: rgba(59, 130, 246, 0.2);
        border-color: var(--accent-color);
        transform: none;
        box-shadow: 0 2px 5px rgba(59, 130, 246, 0.3);
        color: var(--accent-color);
      }

      .reaction-count {
        font-size: 13px;
        color: var(--text-secondary);
        font-weight: 500;
        min-width: 20px;
        text-align: center;
      }

      .reaction-btn.active .reaction-count {
        color: var(--accent-color);
        font-weight: bold;
      }

      .reaction-btn.disabled,
      .reaction-btn:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      .reaction-btn.disabled:hover,
      .reaction-btn:disabled:hover {
        background-color: transparent;
        border-color: transparent;
        box-shadow: none;
      }

      .post-action-link,
      .share-btn {
        background: none;
        border: none;
        color: var(--text-secondary);
        font-size: 14px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
      }

      .post-action-link:hover,
      .share-btn:hover {
        color: var(--accent-color);
      }

      .post-actions-separator {
        color: var(--text-secondary);
        opacity: 0.7;
        user-select: none;
      }

      .post-comments-side {
        display: flex;
        justify-content: flex-start;
        padding: 0;
        flex: 1;
        height: 100%;
        min-height: 0;
        overflow: hidden;
      }

      .post-comments-side.hidden {
        display: none;
      }

      .post-comments-side-box {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        background: var(--bg-secondary);
        padding: 10px 12px;
        color: var(--text-secondary);
        font-size: 13px;
        line-height: 1.4;
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
        overflow: hidden;
      }

      .comments-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        color: var(--text-primary);
        font-weight: 700;
        font-size: 13px;
      }

      .comments-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        margin-bottom: 10px;
        padding-right: 2px;
      }

      .comment-item {
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 8px;
        padding: 8px;
        background: rgba(15, 23, 42, 0.35);
      }

      .comment-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 4px;
        font-size: 11px;
        color: var(--text-secondary);
      }

      .comment-author {
        font-weight: 600;
        color: var(--text-primary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 100px;
      }

      .comment-text {
        color: var(--text-primary);
        font-size: 13px;
        line-height: 1.35;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .comment-actions {
        margin-top: 6px;
        display: flex;
        justify-content: flex-end;
      }

      .comment-delete-btn {
        background: none;
        border: 1px solid rgba(239, 68, 68, 0.45);
        color: #f87171;
        border-radius: 6px;
        font-size: 11px;
        padding: 2px 8px;
        cursor: pointer;
      }

      .comment-empty {
        color: var(--text-secondary);
        font-size: 12px;
        padding: 8px 4px;
        border: 1px dashed rgba(148, 163, 184, 0.3);
        border-radius: 8px;
        text-align: center;
      }

      .comment-form {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .comment-input {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--bg-primary);
        color: var(--text-primary);
        padding: 8px 10px;
        font-size: 12px;
      }

      .comment-submit-btn {
        border: none;
        border-radius: 8px;
        background: var(--accent-color);
        color: white;
        padding: 8px 10px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
      }

      .comments-count {
        font-weight: 700;
        color: var(--text-secondary);
        font-size: 12px;
        margin-left: 3px;
      }

      .guest-note {
        color: var(--warning-color);
        font-size: 13px;
        padding: 6px 0;
      }

      @media (max-width: 980px) {
        .single-post-shell {
          padding: 10px;
        }

        .post-body-layout {
          display: block;
        }

        .post-main-column,
        .post-sidebar-column,
        .post-card.comments-open .post-main-column,
        .post-card.comments-open .post-sidebar-column {
          width: 100%;
          position: static;
        }

        .post-body-layout {
          overflow-y: auto;
        }

        .post-main-column {
          overflow-y: unset;
        }

        .post-card.comments-open .post-sidebar-column {
          display: none;
        }

        .post-sidebar-column {
          border-left: none;
          border-top: 1px solid var(--border-color);
        }

        .post-actions {
          flex-direction: column;
          align-items: stretch;
        }

        .post-actions-left,
        .post-actions-right {
          justify-content: space-between;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-wrap">
      <div id="state" class="state-box">Cargando post...</div>
      <div id="postRoot" style="display: none"></div>
    </div>

    <script type="module">

      function hasPersistedAuthenticatedSessionHint() {
        const stores = [window.localStorage, window.sessionStorage].filter(
          Boolean,
        );
        for (const store of stores) {
          try {
            for (let i = 0; i < store.length; i++) {
              const key = store.key(i);
              if (!key || !key.startsWith("firebase:authUser:")) continue;
              const raw = store.getItem(key);
              if (!raw) continue;

              try {
                const parsed = JSON.parse(raw);
                const hasEmail = !!String(parsed?.email || "").trim();
                const isAnonymous = !!parsed?.isAnonymous;
                if (hasEmail && !isAnonymous) return true;
              } catch (_) {
                if (
                  raw.includes('"isAnonymous":false') &&
                  raw.includes('"email"')
                ) {
                  return true;
                }
              }
            }
          } catch (_) {}
        }
        return false;
      }

      function getTimeAgo(dateValue) {
        const date =
          dateValue instanceof Date ? dateValue : new Date(dateValue);
        if (Number.isNaN(date.getTime())) return "Fecha desconocida";

        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);
        const diffDays = Math.floor(diffMs / 86400000);
        const diffWeeks = Math.floor(diffDays / 7);
        const diffMonths = Math.floor(diffDays / 30);

        if (diffMins < 1) return "Ahora mismo";
        if (diffMins < 60)
          return `Hace ${diffMins} minuto${diffMins > 1 ? "s" : ""}`;
        if (diffHours < 24)
          return `Hace ${diffHours} hora${diffHours > 1 ? "s" : ""}`;
        if (diffDays < 7)
          return `Hace ${diffDays} día${diffDays > 1 ? "s" : ""}`;
        if (diffWeeks < 4)
          return `Hace ${diffWeeks} semana${diffWeeks > 1 ? "s" : ""}`;
        if (diffMonths < 12)
          return `Hace ${diffMonths} mes${diffMonths > 1 ? "es" : ""}`;

        return date.toLocaleDateString("es-ES", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      }

      function getPostDateLabel(dateValue) {
        const safeDate =
          dateValue instanceof Date ? dateValue : new Date(dateValue);
        if (Number.isNaN(safeDate.getTime())) return "Fecha inválida";

        const relative = getTimeAgo(safeDate);
        const absoluteDate = safeDate.toLocaleDateString("es-DO", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
        });
        const absoluteTime = safeDate.toLocaleTimeString("es-DO", {
          hour: "numeric",
          minute: "2-digit",
          hour12: true,
        });

        return `${relative} | ${absoluteDate} | ${absoluteTime}`;
      }

      function isSevenReactionEnabled(now = new Date()) {
        const day = now.getDay();
        const total = now.getHours() * 60 + now.getMinutes();
        if (day === 5) return total >= 17 * 60;
        if (day === 6) return total <= 18 * 60;
        return false;
      }

      function formatReactionCount(count) {
        const numericCount = Number(count) || 0;
        if (numericCount >= 1000000) {
          const valueInMillions = numericCount / 1000000;
          const formatted =
            valueInMillions >= 10
              ? Math.floor(valueInMillions).toString()
              : valueInMillions.toFixed(1).replace(/\.0$/, "");
          return `${formatted} M`;
        }
        if (numericCount >= 1000) {
          const valueInThousands = numericCount / 1000;
          const formatted =
            valueInThousands >= 10
              ? Math.floor(valueInThousands).toString()
              : valueInThousands.toFixed(1).replace(/\.0$/, "");
          return `${formatted} mil`;
        }
        return numericCount.toString();
      }

      async function copyText(text) {
        if (navigator?.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return;
        }
        const helper = document.createElement("textarea");
        helper.value = text;
        helper.setAttribute("readonly", "readonly");
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        document.body.appendChild(helper);
        helper.select();
        document.execCommand("copy");
        document.body.removeChild(helper);
      }

      const LUNA_AUDIO_EXTENSIONS = new Set([
        "mp3",
        "aac",
        "acc",
        "pls",
        "m3u",
        "ogg",
        "oga",
        "m4a",
        "opus",
        "weba",
        "flac",
        "wav",
      ]);

      const CLAPPR_VIDEO_EXTENSIONS = new Set([
        "mp4",
        "web",
        "webm",
        "m3u8",
        "mov",
        "mkv",
        "m4v",
        "avi",
        "ogv",
        "ts",
      ]);

      function getMediaUrlExtension(mediaUrl) {
        const raw = String(mediaUrl || "").trim();
        const regexExt = raw.match(/\.([a-z0-9]{2,5})(?:$|[?#&])/i);
        if (regexExt && regexExt[1]) return regexExt[1].toLowerCase();

        try {
          const parsed = new URL(raw, window.location.origin);
          const fileName = (parsed.pathname || "").split("/").pop() || "";
          const ext = fileName.includes(".") ? fileName.split(".").pop() : "";
          return String(ext || "").trim().toLowerCase();
        } catch (_) {
          const clean = raw.split("?")[0].split("#")[0];
          const fileName = clean.split("/").pop() || "";
          const ext = fileName.includes(".") ? fileName.split(".").pop() : "";
          return String(ext || "").trim().toLowerCase();
        }
      }

      function shouldPreferLunaRadio(post) {
        const mediaType = String(post?.mediaType || "").toLowerCase();
        const mediaUrl = String(post?.mediaUrl || "").toLowerCase();
        const ext = getMediaUrlExtension(mediaUrl);
        if (mediaType === "audio/url" || mediaType.startsWith("audio/")) {
          return true;
        }
        return LUNA_AUDIO_EXTENSIONS.has(ext);
      }

      function extractYouTubeVideoId(mediaUrl) {
        const raw = String(mediaUrl || "").trim();
        if (!raw) return "";

        try {
          const parsed = new URL(raw, window.location.origin);
          const host = (parsed.hostname || "").toLowerCase();
          let candidate = "";

          if (host === "youtu.be") {
            candidate = (parsed.pathname || "").split("/").filter(Boolean)[0] || "";
          } else if (host.endsWith("youtube.com") || host.endsWith("youtube-nocookie.com")) {
            candidate = parsed.searchParams.get("v") || "";
            if (!candidate) {
              const segments = (parsed.pathname || "").split("/").filter(Boolean);
              const marker = segments.findIndex((seg) => ["embed", "shorts", "live", "v"].includes(seg));
              if (marker >= 0 && segments[marker + 1]) {
                candidate = segments[marker + 1];
              }
            }
          }

          candidate = String(candidate || "").trim();
          if (!/^[a-zA-Z0-9_-]{10,15}$/.test(candidate)) return "";
          return candidate;
        } catch (_) {
          return "";
        }
      }

      function hasKnownVideoProvider(mediaUrl) {
        const value = String(mediaUrl || "").toLowerCase().trim();
        if (!value) return false;
        return (
          /(?:youtube\.com|youtu\.be|vimeo\.com|dailymotion\.com|dai\.ly|streamable\.com|twitch\.tv|kick\.com|fb\.watch|facebook\.com\/watch)/i.test(value) ||
          /\.gifv(?:$|[?#])/i.test(value)
        );
      }

      function shouldUseClappr(post) {
        const mediaType = String(post?.mediaType || "").toLowerCase();
        const mediaUrl = String(post?.mediaUrl || "").toLowerCase();
        const ext = getMediaUrlExtension(mediaUrl);
        const imgurDataType = String(post?.imgurData?.type || "").toLowerCase();
        const hasYouTubeHost = /(?:youtube\.com|youtu\.be|youtube-nocookie\.com)/i.test(mediaUrl);
        const youtubeId = extractYouTubeVideoId(mediaUrl);
        if (hasYouTubeHost && !youtubeId) return false;

        if (mediaType.startsWith("video/") && mediaType !== "video/url") return true;
        if (mediaType === "audio/url") return false;
        if (mediaType === "video/url") return !LUNA_AUDIO_EXTENSIONS.has(ext);
        if (imgurDataType.startsWith("video/")) return true;
        if (typeof post?.imgurData?.mp4 === "string" && post.imgurData.mp4.trim()) return true;
        if (hasKnownVideoProvider(mediaUrl)) return true;
        if (CLAPPR_VIDEO_EXTENSIONS.has(ext)) return true;
        return false;
      }

      function resolveClapprSourceUrl(post) {
        const mediaUrl = String(post?.mediaUrl || "").trim();
        if (!mediaUrl) return mediaUrl;

        const mediaType = String(post?.mediaType || "").toLowerCase();
        const imgurMp4 = String(post?.imgurData?.mp4 || "").trim();
        const ext = getMediaUrlExtension(mediaUrl);
        if (imgurMp4) return imgurMp4;
        const youtubeId = extractYouTubeVideoId(mediaUrl);
        if (youtubeId) {
          return `https://www.youtube.com/watch?v=${youtubeId}`;
        }
        if (/\.gifv(?:$|[?#])/i.test(mediaUrl)) {
          return mediaUrl.replace(/\.gifv(?:$|[?#])/i, ".mp4");
        }
        if (CLAPPR_VIDEO_EXTENSIONS.has(ext)) return mediaUrl;
        if (!(mediaType === "video/url" || mediaType.startsWith("video/") || hasKnownVideoProvider(mediaUrl))) return mediaUrl;

        try {
          const parsed = new URL(mediaUrl, window.location.origin);
          if (!/imgur\.com$/i.test(parsed.hostname)) return mediaUrl;

          const fileName = (parsed.pathname || "").split("/").pop() || "";
          const dotAt = fileName.lastIndexOf(".");
          if (dotAt <= 0) return mediaUrl;

          let imgurId = fileName.slice(0, dotAt);
          const fileExt = fileName.slice(dotAt + 1).toLowerCase();
          if (!["jpg", "jpeg", "png", "webp", "gif"].includes(fileExt)) return mediaUrl;

          if (imgurId.length > 6 && /[sbtmlh]$/i.test(imgurId)) {
            imgurId = imgurId.slice(0, -1);
          }

          if (!/^[a-z0-9]+$/i.test(imgurId)) return mediaUrl;
          return `https://i.imgur.com/${imgurId}.mp4`;
        } catch (_) {
          return mediaUrl;
        }
      }

      function getVideoBlurBackgroundUrl(post) {
        if (!post || typeof post !== "object") return "";
        const candidates = [
          post.thumbnailUrl,
          post.thumbnail,
          post.thumbUrl,
          post.posterUrl,
          post.poster,
          post.radiocover,
          post.imgurData?.thumbnail,
          post.imgurData?.thumb,
          post.imgurData?.poster,
        ].filter((value) => typeof value === "string" && value.trim());
        return candidates.length ? candidates[0].trim() : "";
      }

      function getAvailableClapprPlugins(mediaUrl = "") {
        const plugins = [];
        if (typeof AudioTrackSelector !== "undefined") plugins.push(AudioTrackSelector);
        if (typeof HlsjsPlayback !== "undefined") plugins.push(HlsjsPlayback);
        if (typeof DashShakaPlayback !== "undefined") plugins.push(DashShakaPlayback);
        if (typeof ClapprPip !== "undefined") {
          if (ClapprPip.PipButton) plugins.push(ClapprPip.PipButton);
          if (ClapprPip.PipPlugin) plugins.push(ClapprPip.PipPlugin);
        }
        if (typeof LevelSelector !== "undefined") plugins.push(LevelSelector);
        if (typeof PlaybackRatePlugin !== "undefined") plugins.push(PlaybackRatePlugin);
        const hasYouTubeId = !!extractYouTubeVideoId(mediaUrl);
        if (hasYouTubeId && typeof YoutubePlayback !== "undefined") plugins.push(YoutubePlayback);
        return plugins;
      }

      function buildClapprPlaybackRateConfig() {
        return {
          defaultValue: 1,
          options: [
            { value: 0.1, label: "0.1x" },
            { value: 0.5, label: "0.5x" },
            { value: 0.75, label: "0.75x" },
            { value: 1, label: "Normal" },
            { value: 1.5, label: "1.5x" },
            { value: 2, label: "2x" },
            { value: 4, label: "4x" },
          ],
        };
      }

      function buildClapprLevelSelectorConfig() {
        return {
          title: "Calidad",
          labels: {
            7: "",
            6: "",
            5: "",
            4: "",
            3: "",
            2: "",
            1: "",
            0: "",
          },
          labelCallback(playbackLevel, customLabel) {
            const height = playbackLevel?.level?.height;
            if (!height) return customLabel || "Auto";
            return `${customLabel || ""}${height}p`;
          },
          onLevelsAvailable(levels) {
            return Array.isArray(levels) ? levels.slice().reverse() : levels;
          },
        };
      }

      function buildClapprPlayerOptions(containerId, post) {
        const mediaUrl = resolveClapprSourceUrl(post);
        const ext = getMediaUrlExtension(mediaUrl);
        const isHls = ext === "m3u8" || /\.m3u8(?:$|[?#])/i.test(mediaUrl);
        const posterUrl =
          post?.posterUrl ||
          post?.radiocover ||
          getVideoBlurBackgroundUrl(post) ||
          "https://dummyimage.com/640x360/0f172a/ffffff&text=Conquiguias+TV";

        const options = {
          source: mediaUrl,
          parentId: `#${containerId}`,
          poster: posterUrl,
          width: "100%",
          height: "100%",
          autoPlay: false,
          hideVolumeBar: false,
          disableVideoTagContextMenu: true,
          playbackNotSupportedMessage: "No se puede reproducir.",
          plugins: getAvailableClapprPlugins(mediaUrl),
          playbackRateConfig: buildClapprPlaybackRateConfig(),
          levelSelectorConfig: buildClapprLevelSelectorConfig(),
          playback: {
            crossOrigin: "anonymous",
            extrapolatedWindowNumSegments: 2,
            triggerFatalErrorOnResourceDenied: false,
            hlsjsConfig: {
              enableWebVTT: true,
              captions: true,
              maxBufferLength: 10,
              maxBufferSize: 12 * 1000 * 1000,
              liveSyncDuration: 5,
              liveMaxLatencyDuration: 60,
              enableWorker: true,
              enableSoftwareAES: true,
              capLevelToPlayerSize: true,
              autoStartLoad: true,
              startPosition: -1,
              maxRetries: 6,
              retryDelay: 2000,
              lowLatencyMode: isHls,
            },
          },
        };

        if (isHls) {
          Object.assign(options, {
            actualLiveTime: true,
            hideMediaControl: true,
            hlsUseNextLevel: true,
            hlsMinimumDvrSize: 120,
            hlsRecoverAttempts: 16,
            hlsPlayback: {
              preload: true,
              customListeners: [],
            },
          });
        }
        return options;
      }

      function initClapprPlayerWithFallback(containerId, post) {
        if (typeof Clappr === "undefined") return;
        const container = document.getElementById(containerId);
        if (!container || !post?.mediaUrl) return;

        container.classList.add("clappr-container");
        container.dataset.src = post.mediaUrl;

        if (container.dataset.cxClapprInteractionBound !== "1") {
          container.dataset.cxClapprInteractionBound = "1";
          container.addEventListener("click", () => {
            refreshPostMediaLayout(container.closest(".post-card"));
          });
          container.addEventListener(
            "touchstart",
            () => {
              refreshPostMediaLayout(container.closest(".post-card"));
            },
            { passive: true },
          );
        }

        if (window._postClapprPlayer) {
          try {
            window._postClapprPlayer.destroy();
          } catch (_) {}
          window._postClapprPlayer = null;
        }

        const fail = () => {
          try {
            if (window._postClapprPlayer && typeof window._postClapprPlayer.destroy === "function") {
              window._postClapprPlayer.destroy();
            }
          } catch (_) {}
          window._postClapprPlayer = null;
        };

        try {
          window._postClapprPlayer = new Clappr.Player(
            buildClapprPlayerOptions(containerId, post),
          );

          try {
            const clickToPausePlugin =
              window._postClapprPlayer.getPlugin &&
              window._postClapprPlayer.getPlugin("click_to_pause");
            if (clickToPausePlugin && typeof clickToPausePlugin.disable === "function") {
              clickToPausePlugin.disable();
            }
          } catch (_) {}

          window._postClapprPlayer.on(Clappr.Events.PLAYER_PLAY, () => {
            incrementPostViewCount(post.id);
          });

          if (Clappr.Events.PLAYER_READY) {
            window._postClapprPlayer.on(Clappr.Events.PLAYER_READY, () => {
              container.dataset.cxClapprReady = "1";
            });
          }

          if (Clappr.Events.PLAYER_ERROR) {
            window._postClapprPlayer.on(Clappr.Events.PLAYER_ERROR, fail);
          }

          if (Clappr.Events.ERROR) {
            window._postClapprPlayer.on(Clappr.Events.ERROR, fail);
          }
        } catch (_) {
          fail();
        }
      }

      function refreshPostMediaLayout(postCard) {
        if (!postCard) return;

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            window.dispatchEvent(new Event("resize"));

            postCard.querySelectorAll(".clappr-container").forEach((container) => {
              const player = window._postClapprPlayer;
              if (!player || typeof player.resize !== "function") return;

              const width = container.clientWidth || 0;
              const height = container.clientHeight || 0;

              try {
                if (width > 0 && height > 0) {
                  player.resize({ width, height });
                } else {
                  player.resize();
                }
              } catch (_) {}
            });

            postCard.querySelectorAll(".lunaradio-host, .lunaradio-host .lunaaudioplayer").forEach((el) => {
              el.style.width = "100%";
              el.style.height = "100%";
            });
          });

      function parseCommentDate(value) {
        if (!value) return new Date();
        if (value instanceof Date) return value;
        if (typeof value === "string" || typeof value === "number") {
          const date = new Date(value);
          return Number.isNaN(date.getTime()) ? new Date() : date;
        }
        if (value?.seconds) return new Date(value.seconds * 1000);
        return new Date();
      }

      function formatRichText(text) {
        const escaped = escapeHtml(text);
        const withMentions = escaped
          .replace(
            /@([a-zA-Z0-9_]+)/g,
            '<span style="color: var(--accent-color); font-weight: bold;">@$1</span>',
          )
          .replace(
            /#([a-zA-Z0-9_]+)/g,
            '<span style="color: var(--success-color); font-weight: bold;">#$1</span>',
          );

        const linkRegex = /(^|[\s(])((?:https?:\/\/|www\.)[^\s<]+)/gi;
        const withLinks = withMentions.replace(
          linkRegex,
          (match, prefix = "", rawUrl = "") => {
            let cleanUrl = rawUrl;
            let trailing = "";

            while (/[.,!?;:)]$/.test(cleanUrl)) {
              trailing = cleanUrl.slice(-1) + trailing;
              cleanUrl = cleanUrl.slice(0, -1);
            }

            if (!cleanUrl) return match;

            const href = cleanUrl.startsWith("www.")
              ? `https://${cleanUrl}`
              : cleanUrl;
            const displayUrl =
              cleanUrl.length > 45 ? `${cleanUrl.slice(0, 42)}...` : cleanUrl;

            return `${prefix}<a href="${href}" target="_blank" rel="noopener noreferrer" style="color: var(--accent-color); text-decoration: underline;" title="${href}">🔗 ${displayUrl}</a>${trailing}`;
          },
        );

        return withLinks.replace(/\n/g, "<br>");
      }

      function formatPostDescription(text, postId) {
        if (!text || typeof text !== "string") return "";

        const normalizedPostId = String(postId || "");
        const fullText = text;

        if (normalizedPostId) {
          postReadMoreCache.set(normalizedPostId, fullText);
        }

        const isExpanded = normalizedPostId && postReadMoreExpanded.has(normalizedPostId);
        const fullFormattedText = formatRichText(fullText);
        const encodedPostId = encodeURIComponent(normalizedPostId);

        if (isExpanded) {
          return `
            <div class="post-description-text">${fullFormattedText}</div>
            <button class="read-less-btn" type="button" data-read-toggle-postid="${encodedPostId}">Ver menos</button>
          `;
        }

        return `
          <div class="post-description-clamp-wrap" data-readmore-wrap="${encodedPostId}">
            <div class="post-description-text clamped">${fullFormattedText}</div>
            <button class="read-more-btn" type="button" data-read-toggle-postid="${encodedPostId}">... Leer más</button>
          </div>
        `;
      }

      function applyReadMoreOverflowState(scope = document) {
        const root = scope instanceof Element || scope instanceof Document ? scope : document;
        root.querySelectorAll(".post-description .post-description-clamp-wrap").forEach((wrap) => {
          const textEl = wrap.querySelector(".post-description-text");
          const btn = wrap.querySelector(".read-more-btn");
          if (!textEl || !btn) return;

          const isOverflowing = textEl.scrollHeight > (textEl.clientHeight + 1);
          wrap.classList.toggle("has-overflow", isOverflowing);

          if (!isOverflowing) {
            textEl.classList.remove("clamped");
          }
        });
      }

      function toggleReadMore(postId) {
        const normalizedPostId = String(postId || "");
        const descriptionElement = document.getElementById(`post-description-${normalizedPostId}`);
        const fullText = postReadMoreCache.get(normalizedPostId) || "";
        if (!descriptionElement || !fullText) return;

        if (postReadMoreExpanded.has(normalizedPostId)) {
          postReadMoreExpanded.delete(normalizedPostId);
        } else {
          postReadMoreExpanded.add(normalizedPostId);
        }

        descriptionElement.innerHTML = formatPostDescription(fullText, normalizedPostId);
        requestAnimationFrame(() => applyReadMoreOverflowState(descriptionElement));
      }

      function getCommentsPanelMarkup(postIdValue, comments = []) {
        const normalized = Array.isArray(comments) ? comments : [];

        const commentsHTML = normalized.length
          ? normalized
              .slice()
              .sort(
                (a, b) =>
                  parseCommentDate(a?.createdAt) -
                  parseCommentDate(b?.createdAt),
              )
              .map((comment) => {
                const author = escapeHtml(comment?.userName || "Usuario");
                const text = escapeHtml(comment?.text || "");
                const timeText = getTimeAgo(
                  parseCommentDate(comment?.createdAt),
                );
                const commentId = escapeHtml(comment?.id || "");
                const canDelete =
                  !!currentUser && comment?.userId === currentUser.uid;

                return `
                <div class="comment-item">
                  <div class="comment-meta">
                    <span class="comment-author">${author}</span>
                    <span>${timeText}</span>
                  </div>
                  <div class="comment-text">${text}</div>
                  ${canDelete ? `<div class="comment-actions"><button type="button" class="comment-delete-btn" data-postid="${postIdValue}" data-commentid="${commentId}">Eliminar</button></div>` : ""}
                </div>
              `;
              })
              .join("")
          : '<div class="comment-empty">Aún no hay comentarios. Sé el primero en comentar.</div>';

        return `
        <div class="post-comments-side-box comments-panel" data-postid="${postIdValue}">
          <div class="comments-head">
            <span>Comentarios</span>
            <span>${formatReactionCount(normalized.length)}</span>
          </div>
          <div class="comments-list">${commentsHTML}</div>
          ${
            isGuest
              ? '<div class="guest-note">Inicia sesión para comentar en este post.</div>'
              : `<form class="comment-form" data-postid="${postIdValue}">
                <input class="comment-input" type="text" maxlength="300" placeholder="Escribe un comentario..." required>
                <button class="comment-submit-btn" type="submit">Enviar</button>
              </form>`
          }
        </div>
      `;
      }

      function ensureCommentsMobileModal() {
        let modal = document.getElementById("commentsMobileModal");
        if (modal) return modal;

        modal = document.createElement("div");
        modal.id = "commentsMobileModal";
        modal.className = "comments-mobile-modal";
        modal.innerHTML = `
        <div class="comments-mobile-content" role="dialog" aria-modal="true" aria-label="Comentarios">
          <div class="comments-mobile-header">
            <span>Comentarios</span>
            <button type="button" class="comments-mobile-close" id="commentsMobileClose">&times;</button>
          </div>
          <div class="comments-mobile-body" id="commentsMobileBody"></div>
        </div>
      `;

        document.body.appendChild(modal);

        modal.addEventListener("click", (event) => {
          if (event.target === modal) modal.style.display = "none";
        });

        const closeBtn = modal.querySelector("#commentsMobileClose");
        if (closeBtn)
          closeBtn.addEventListener("click", () => {
            modal.style.display = "none";
          });

        // Delegate comment form and delete inside modal
        modal.addEventListener("submit", async (event) => {
          const form = event.target.closest(".comment-form");
          if (!form) return;
          event.preventDefault();
          const input = form.querySelector(".comment-input");
          const text = String(input?.value || "").trim();
          if (!text) return;
          await addComment(text);
          if (input) input.value = "";
          // Refresh modal body
          const body = document.getElementById("commentsMobileBody");
          if (body && currentPost)
            body.innerHTML = getCommentsPanelMarkup(
              currentPost.id,
              Array.isArray(currentPost.comments) ? currentPost.comments : [],
            );
        });

        modal.addEventListener("click", async (event) => {
          const deleteBtn = event.target.closest(".comment-delete-btn");
          if (!deleteBtn) return;
          const commentId = deleteBtn.getAttribute("data-commentid");
          if (!commentId) return;
          await deleteComment(commentId);
          const body = document.getElementById("commentsMobileBody");
          if (body && currentPost)
            body.innerHTML = getCommentsPanelMarkup(
              currentPost.id,
              Array.isArray(currentPost.comments) ? currentPost.comments : [],
            );
        });

        return modal;
      }

      function openCommentsModalMobile(postId, comments) {

        modal.dataset.postid = postId;

              </div>
            </div>
          </article>
        </div>
      `;

        postRoot.style.display = "flex";
        stateEl.style.display = "none";

        if (isVideoMedia && post.mediaUrl) {
          setTimeout(() => {
            initClapprPlayerWithFallback(`clappr-post-player-${renderPostId}`, post);
          }, 250);
        } else if (isAudioMedia && post.mediaUrl) {
          setTimeout(() => {
            initLunaRadioPlayer(`stream-post-player-${renderPostId}`, post);
          }, 250);
        }

        postRoot.querySelectorAll("button[data-read-toggle-postid]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const encodedId = btn.getAttribute("data-read-toggle-postid") || "";
            if (!encodedId) return;
            toggleReadMore(decodeURIComponent(encodedId));
          });
        });

        requestAnimationFrame(() => applyReadMoreOverflowState(postRoot));

        // Auto-open comments sidebar on desktop
        if (window.matchMedia("(min-width: 981px)").matches) {
          const commentsSideAuto = document.getElementById(
            `post-comments-side-${post.id}`,
          );
          const postCardAuto = postRoot.querySelector(".post-card");
          if (commentsSideAuto && postCardAuto) {
            commentsSideAuto.classList.remove("hidden");
            postCardAuto.classList.add("comments-open");
            refreshPostMediaLayout(postCardAuto);
          }
        }

        document.getElementById("shareBtn")?.addEventListener("click", () => {
          openShareModal(post.id, post.shareCount || 0);
        });

        document
          .getElementById("commentsBtn")
          ?.addEventListener("click", () => {
            if (window.matchMedia("(max-width: 980px)").matches) {
              openCommentsModalMobile(
                post.id,
                Array.isArray(post.comments) ? post.comments : [],
              );
              return;
            }
            const commentsSide = document.getElementById(
              `post-comments-side-${post.id}`,
            );
            const postCard = postRoot.querySelector(".post-card");
            if (!commentsSide || !postCard) return;

            const willOpen = commentsSide.classList.contains("hidden");
            commentsSide.classList.toggle("hidden");
            if (willOpen) {
              postCard.classList.add("comments-open");
            } else {
              postCard.classList.remove("comments-open");
            }
            refreshPostMediaLayout(postCard);
            requestAnimationFrame(() => applyReadMoreOverflowState(postRoot));
          });

        postRoot.querySelectorAll(".reaction-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (btn.classList.contains("disabled")) return;
            const reaction = btn.getAttribute("data-reaction");
            await toggleReaction(reaction);
          });
        });

        postRoot
          .querySelector(".comment-form")
          ?.addEventListener("submit", async (event) => {
            event.preventDefault();
            const input = event.target.querySelector(".comment-input");
            const text = String(input?.value || "").trim();
            if (!text) return;
            await addComment(text);
            input.value = "";
          });

        postRoot.querySelectorAll(".comment-delete-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const commentId = btn.getAttribute("data-commentid");
            if (!commentId) return;
            await deleteComment(commentId);
          });
        });
      }

      async function toggleReaction(newReaction) {
        if (!currentUser || !currentPost) return;
        if (newReaction === "seven" && !isSevenReactionEnabled()) return;

        const postRef = doc(db, "posts", currentPost.id);
        const snap = await getDoc(postRef);
        if (!snap.exists()) return;

        const data = snap.data();
        const reactions = normalizeReactions(data.reactions || {});
        const allTypes = ["like", "laugh", "seven"];
        const uid = currentUser.uid;

        const hadSame = reactions[newReaction].includes(uid);
        if (hadSame) {
          reactions[newReaction] = reactions[newReaction].filter(
            (id) => id !== uid,
          );
        } else {
          allTypes.forEach((type) => {
            reactions[type] = reactions[type].filter((id) => id !== uid);
          });
          reactions[newReaction].push(uid);
        }

        await updateDoc(postRef, { reactions });
        currentPost = { ...data, id: snap.id, reactions };
        renderPost(currentPost);
      }

      async function addComment(text) {
        if (!currentUser || !currentPost) return;

        const postRef = doc(db, "posts", currentPost.id);
        const snap = await getDoc(postRef);
        if (!snap.exists()) return;
        const data = snap.data() || {};
        const comments = Array.isArray(data.comments) ? data.comments : [];

        comments.push({
          id: `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`,
          userId: currentUser.uid,
          userName:
            `${currentUserProfile?.nombre || ""} ${currentUserProfile?.apellido || ""}`.trim() ||
            currentUser.displayName ||
            "Usuario",
          text,
          createdAt: new Date().toISOString(),
        });

        await updateDoc(postRef, { comments });
        currentPost = { ...data, id: snap.id, comments };
        renderPost(currentPost);

        const commentsSide = document.getElementById(
          `post-comments-side-${currentPost.id}`,
        );
        const postCard = postRoot.querySelector(".post-card");
        if (commentsSide && postCard) {
          commentsSide.classList.remove("hidden");
          postCard.classList.add("comments-open");
        }
      }

      async function deleteComment(commentId) {
        if (!currentUser || !currentPost || !commentId) return;

        const postRef = doc(db, "posts", currentPost.id);
        const snap = await getDoc(postRef);
        if (!snap.exists()) return;

        const data = snap.data() || {};
        const comments = Array.isArray(data.comments) ? data.comments : [];
        const target = comments.find((comment) => comment?.id === commentId);
        if (!target || target.userId !== currentUser.uid) return;

        const updatedComments = comments.filter(
          (comment) => comment?.id !== commentId,
        );
        await updateDoc(postRef, { comments: updatedComments });
        currentPost = { ...data, id: snap.id, comments: updatedComments };
        renderPost(currentPost);

        const commentsSide = document.getElementById(
          `post-comments-side-${currentPost.id}`,
        );
        const postCard = postRoot.querySelector(".post-card");
        if (commentsSide && postCard) {
          commentsSide.classList.remove("hidden");
          postCard.classList.add("comments-open");
        }
      }

      async function loadPostById(id) {
        if (id === LIVE_POST_ID) {
          const liveData = await checkLiveStream();
          if (!liveData?.live) {
            showState(
              "La transmisión en vivo no está disponible en este momento.",
            );
            return;
          }
        }

        const ref = doc(db, "posts", id);
        const snap = await getDoc(ref);
        if (!snap.exists()) {
          showState("Post no encontrado.");
          return;
        }

        const data = snap.data() || {};
        const isOwner = !!currentUser && data.userId === currentUser.uid;
        if (data.status !== "approved" && !isOwner) {
          showState("Este post no está disponible públicamente.");
          return;
        }

        currentPost = { ...data, id: snap.id };
        renderPost(currentPost);
      }

      async function initialize() {
        if (!postId) {
          showState("Falta el parámetro id del post.");
          return;
        }

        const configRes = await fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "get-config" }),
        });
        if (!configRes.ok) {
          showState("No se pudo cargar la configuración.");
          return;
        }

        const firebaseConfig = await configRes.json();
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);
        await configureAuthPersistence(auth);

        onAuthStateChanged(auth, async (user) => {
          if (!user) {
            try {
              if (typeof auth.authStateReady === "function") {
                await auth.authStateReady();
              }
            } catch (stateReadyError) {
              console.warn(
                "[WARN] authStateReady falló en posts:",
                stateReadyError,
              );
            }

            const recoveredUser = auth.currentUser;
            if (recoveredUser && !recoveredUser.isAnonymous) {
              return;
            }

            const hasPersistentRealSession =
              hasPersistedAuthenticatedSessionHint();
            if (hasAuthenticatedSessionInThisView || hasPersistentRealSession) {
              showState("Restaurando sesión...");
              return;
            }

            // Sign in anonymously so Firestore rules (require auth) allow reads
            try {
              await signInAnonymously(auth);
              // onAuthStateChanged will fire again with the anonymous user
            } catch (anonErr) {
              console.error("signInAnonymously falló:", anonErr);
              showState(
                "⚠️ La autenticación anónima no está habilitada. Actívala en Firebase Console → Authentication → Sign-in method → Anonymous → Habilitar.",
              );
            }
            return;
          }

          const isAnon = user.isAnonymous;
          currentUser = isAnon ? null : user;
          isGuest = isAnon;
          if (!isAnon) {
            hasAuthenticatedSessionInThisView = true;
          }

          if (!isGuest) {
            try {
              const profileSnap = await getDoc(doc(db, "usuarios", user.uid));
              currentUserProfile = profileSnap.exists()
                ? profileSnap.data() || {}
                : null;
            } catch {
              currentUserProfile = null;
            }
          } else {
            currentUserProfile = null;
          }

          try {
            await loadAdminEmails();
            await loadPostById(postId);
          } catch (err) {
            console.error(err);
            showState("No se pudo cargar el post.");
          }
        });
      }

      initialize().catch((error) => {
        console.error(error);
        showState("Error al inicializar la página del post.");
      });
    </script>
  </body>
</html>
